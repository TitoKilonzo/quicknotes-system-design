<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes API Client</h1>
      <p>Talking to a real API: load, create and delete notes.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <p class="field">
            <label for="title-input">Title</label>
            <input type="text" id="title-input" name="title" placeholder="Required, up to 100 characters" />
          </p>
          <p class="field">
            <label for="body-input">Note (optional)</label>
            <textarea id="body-input" name="body" rows="4" placeholder="Write the details here..."></textarea>
          </p>
          <button type="submit" id="submit-btn">Add note</button>
        </form>
      </section>

      <section>
        <h2>Your notes</h2>
        <button type="button" id="load-btn">Load notes</button>
        <p id="status" class="status" role="status"></p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>Practice data comes from JSONPlaceholder.</p>
    </footer>
  </body>
</html>
